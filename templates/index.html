<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HO.ME &ndash; Hospital Near Me (Neonatal)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @font-face {
            font-family: 'Fredoka';
            src: url('/static/Fredoka Variable Font.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --teal:       #66bca2;
            --teal-light: #e0f2ec;
            --dark-teal:  #2e5b5f;
            --orange:     #d2712a;
            --orange-light: #fdf0e6;
            --bg:         #f4f9f7;
            --surface:    #ffffff;
            --border:     #e0eeeb;
            --text:       #2e5b5f;
            --text-mid:   #4a7a7e;
            --text-soft:  #8aadb0;
            --radius:     12px;
            --shadow:     0 2px 12px rgba(46,91,95,0.09);
            --shadow-lg:  0 6px 28px rgba(46,91,95,0.15);
        }
        body { font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--dark-teal); }
        .header-accent { height: 3px; background: var(--orange); }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 20px; }
        .header-map { flex-shrink: 0; opacity: 0.95; }
        .header-wordmark { flex: 1; min-width: 0; }
        main { flex: 1; }
        .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab { padding: 10px 22px; font-size: 1rem; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text-soft); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.18s; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .tab:hover { color: var(--dark-teal); }
        .tab.active { color: var(--dark-teal); border-bottom-color: var(--orange); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .loading-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 28px; color: var(--text-mid); font-size: 0.95rem; }
        .loading-msg { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .loading-spinner { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
        .progress-track { height: 5px; background: var(--bg); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--orange)); border-radius: 99px; width: 0%; transition: width 0.35s ease; }
        .search-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px; margin-bottom: 16px; }
        .search-label { font-size: 0.82rem; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
        .search-row { display: flex; gap: 10px; align-items: stretch; }
        .search-input-wrap { flex: 1; position: relative; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-soft); pointer-events: none; }
        .search-input-wrap input { width: 100%; font-size: 1.05rem; font-family: 'Fredoka', sans-serif; font-weight: 400; padding: 11px 14px 11px 42px; border: 2px solid var(--border); border-radius: 10px; outline: none; color: var(--text); background: white; transition: border-color 0.18s, box-shadow 0.18s; }
        .search-input-wrap input::placeholder { color: var(--text-soft); }
        .search-input-wrap input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(102,188,162,0.15); }
        .search-btn { background: var(--orange); color: white; border: none; padding: 11px 22px; border-radius: 10px; font-size: 1rem; font-weight: 600; font-family: 'Fredoka', sans-serif; cursor: pointer; transition: background 0.18s, transform 0.12s; display: flex; align-items: center; gap: 6px; white-space: nowrap; box-shadow: 0 2px 8px rgba(210,113,42,0.3); }
        .search-btn:hover { background: #b85e20; }
        .search-btn:active { transform: scale(0.98); }
        .error-bar { background: #fff5f0; color: #b84c20; border: 1px solid #f5c7ad; border-radius: 10px; padding: 12px 16px; margin-top: 12px; font-size: 0.92rem; display: none; align-items: center; gap: 8px; }
        #results { display: none; }
        .result-meta { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .result-meta-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .result-postcode { font-size: 1.6rem; font-weight: 600; color: var(--dark-teal); letter-spacing: 0.01em; }
        .side-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 99px; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.02em; }
        .side-north { background: var(--teal-light); color: var(--dark-teal); }
        .side-south { background: var(--orange-light); color: #7a3d0e; }
        .result-hint { font-size: 0.85rem; color: var(--text-soft); }
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border: 1.5px solid var(--border); transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .card.level-any::before { background: var(--dark-teal); }
        .card.level-l1::before  { background: var(--teal); }
        .card.level-l2::before  { background: var(--orange); }
        .card.level-l3::before  { background: #c0392b; }
        .card-level-badge { display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; padding: 3px 8px; border-radius: 99px; margin-bottom: 10px; }
        .card.level-any .card-level-badge { background: rgba(46,91,95,0.1); color: var(--dark-teal); }
        .card.level-l1  .card-level-badge { background: rgba(102,188,162,0.15); color: #2a7a60; }
        .card.level-l2  .card-level-badge { background: var(--orange-light); color: #7a3d0e; }
        .card.level-l3  .card-level-badge { background: #fff0ee; color: #c0392b; }
        .card-hospital { font-size: 0.96rem; font-weight: 600; color: var(--dark-teal); line-height: 1.3; margin-bottom: 6px; }
        .card-distance { font-size: 0.85rem; color: var(--orange); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .card-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
        .tag { display: inline-block; background: #fff0ee; color: #c0392b; font-size: 0.67rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.03em; }
        #map-container { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 6px; }
        #map { height: 380px; width: 100%; }
        #catchment-map { height: calc(100vh - 145px); width: 100%; border: none; border-radius: 0; }
        #catchment-map .leaflet-control-layers { max-height: calc(100vh - 200px); overflow-y: auto; }
        .spinner { display: none; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.65s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { background: var(--dark-teal); padding: 16px 24px; text-align: center; color: rgba(255,255,255,0.45); font-size: 0.82rem; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; font-family: 'Fredoka', sans-serif; }
        footer a { color: rgba(255,255,255,0.7); text-decoration: none; font-weight: 500; transition: color 0.15s; }
        footer a:hover { color: white; }
        footer .footer-sep { color: rgba(255,255,255,0.2); }
        @media (max-width: 800px) { .cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 560px) {
            .header-inner { padding: 12px 16px; gap: 12px; }
            .search-row { flex-direction: column; }
            .tabs { overflow-x: auto; }
            .container { padding: 20px 16px; }
        }
        @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }

    </style>
</head>

<script>

    let postcodeData = null;
    let hospitalData = null;
    let map = null;
    let markers = [];
    let catchmentLoaded = false;
    let catchmentMap = null;

    const levelClasses = ['level-any', 'level-l1', 'level-l2', 'level-l3'];
    const levelColours = ['#1855A3', '#16A34A', '#D97706', '#DC2626'];
    const levelLabels = ['Any Level', 'Level 1 — Special Care', 'Level 2 — High Dependency', 'Level 3 — NICU'];

    async function loadData() {
        const fill = document.getElementById('progressFill');
        fill.style.width = '20%';
        const [pcRes, hospRes] = await Promise.all([fetch('postcodes.json'), fetch('hospitals.json')]);
        fill.style.width = '60%';
        postcodeData = await pcRes.json();
        fill.style.width = '85%';
        hospitalData = hospRes.json ? await hospRes.json() : hospRes;
        fill.style.width = '100%';
        window.hospCoords = {};
        hospitalData.forEach(h => {
            window.hospCoords[h.name] = { lat: h.lat, lon: h.lon, level: h.level, side: h.side, tags: h.tags || '' };
        });
        setTimeout(() => {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('searchForm').style.display = 'block';
        }, 300);
    }

    loadData();

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
        document.getElementById('tab-' + tabName).classList.add('active');
        if (tabName === 'catchment' && !catchmentLoaded) buildCatchmentMap();
    }

    async function buildCatchmentMap() {
        document.getElementById('catchment-loading').style.display = 'block';
        while (!postcodeData || !hospitalData) { await new Promise(r => setTimeout(r, 100)); }
        const mapDiv = document.getElementById('catchment-map');
        mapDiv.style.display = 'block';
        catchmentMap = L.map(mapDiv).setView([51.5, -0.1], 10);
        setTimeout(() => catchmentMap.invalidateSize(), 50);
        const baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 19,
        }).addTo(catchmentMap);
        const SECTOR_RANGES = {
            'NC':     { h: [210, 235], s: [80, 90], l: [22, 72] },
            'NE':     { h: [108, 145], s: [72, 88], l: [20, 68] },
            'NW':     { h: [268, 308], s: [68, 85], l: [22, 70] },
            'SE':     { h: [18,  44],  s: [82, 95], l: [28, 70] },
            'SW':     { h: [328, 354], s: [68, 88], l: [32, 74] },
            'Border': { h: [22,  40],  s: [45, 60], l: [22, 62] },
        };
        const SECTOR_ORDER = ['NC', 'NE', 'NW', 'SE', 'SW', 'Border'];
        const SECTOR_LABELS = { 'NC': 'North Central', 'NE': 'North East', 'NW': 'North West', 'SE': 'South East', 'SW': 'South West', 'Border': 'Border' };
        const SECTOR_NORMALISATION = { 'South East': 'SE', 'South West': 'SW' };
        function normaliseSector(raw) {
            if (!raw) return 'Border';
            const norm = SECTOR_NORMALISATION[String(raw).trim()] || String(raw).trim();
            return SECTOR_RANGES[norm] ? norm : 'Border';
        }
        function interleavedOrder(n) {
            const order = []; let lo = 0; let hi = n - 1;
            while (lo <= hi) { order.push(lo++); if (lo <= hi) order.push(hi--); }
            return order;
        }
        function interpolate(start, end, t) { return Math.round(start + t * (end - start)); }
        const names = postcodeData.names;
        const catchmentMeta = postcodeData.catchment || {};
        const precomputedPoints = Array.isArray(catchmentMeta.points) ? catchmentMeta.points : null;
        const sampleRate = Number.isInteger(catchmentMeta.sample_rate) ? catchmentMeta.sample_rate : 10;
        const hospitalSectorMap = {};
        hospitalData.forEach(h => { hospitalSectorMap[h.name] = normaliseSector(h.sector); });
        const sectorHosps = {};
        SECTOR_ORDER.forEach(s => { sectorHosps[s] = []; });
        names.forEach(name => { const sec = hospitalSectorMap[name] || 'Border'; sectorHosps[sec].push(name); });
        SECTOR_ORDER.forEach(sec => sectorHosps[sec].sort());
        const colours = {};
        SECTOR_ORDER.forEach(sec => {
            const hosps = sectorHosps[sec]; const n = hosps.length;
            if (!n) return;
            const { h, s, l } = SECTOR_RANGES[sec];
            const order = interleavedOrder(n);
            hosps.forEach((name, i) => {
                const t = n === 1 ? 0.5 : order[i] / (n - 1);
                const hue = interpolate(h[0], h[1], t);
                const sat = interpolate(s[0], s[1], t);
                let lit = interpolate(l[0], l[1], t);
                if (name === "Evelina (St Thomas')" || name === 'Chelsea & Westminster') lit = Math.min(lit + 12, 100);
                colours[name] = 'hsl(' + hue + ',' + sat + '%,' + lit + '%)';
            });
        });
        const countsByName = {};
        if (Array.isArray(catchmentMeta.counts_any) && catchmentMeta.counts_any.length === names.length) {
            names.forEach((name, idx) => { countsByName[name] = catchmentMeta.counts_any[idx] || 0; });
        } else {
            Object.keys(postcodeData.data).forEach(key => {
                const r = postcodeData.data[key];
                const hospName = names[r[4]];
                countsByName[hospName] = (countsByName[hospName] || 0) + 1;
            });
        }
        const hospLayers = {};
        names.forEach(name => { hospLayers[name] = L.layerGroup().addTo(catchmentMap); });
        const points = precomputedPoints || (() => {
            const keys = Object.keys(postcodeData.data);
            return keys.filter((_, i) => i % sampleRate === 0).map(key => {
                const r = postcodeData.data[key]; return [r[0], r[1], r[2], r[4]];
            });
        })();
        const suppressedTotal = Number.isInteger(catchmentMeta.suppressed_total) ? catchmentMeta.suppressed_total : 0;
        const displaySampleRate = precomputedPoints ? (catchmentMeta.sample_rate || 5) : sampleRate;
        document.getElementById('catchment-loading-text').textContent =
            'Rendering ' + points.length.toLocaleString() + ' sampled points (1/' + displaySampleRate +
            (suppressedTotal ? ', ' + suppressedTotal.toLocaleString() + ' suppressed' : '') + '…';
        document.getElementById('barFill').style.width = '50%';
        const batchSize = 2000;
        for (let i = 0; i < points.length; i += batchSize) {
            const batch = points.slice(i, i + batchSize);
            batch.forEach(pt => {
                const hospName = names[pt[3]];
                if (!hospName || !hospLayers[hospName]) return;
                const col = colours[hospName] || '#888';
                L.circleMarker([pt[1], pt[2]], { radius: 3, color: col, fillColor: col, fillOpacity: 0.6, weight: 0 })
                 .bindTooltip(pt[0], { sticky: true }).addTo(hospLayers[hospName]);
            });
            await new Promise(r => setTimeout(r, 0));
        }
        const hospMarkerLayer = L.layerGroup().addTo(catchmentMap);
        hospitalData.forEach(h => {
            L.circleMarker([h.lat, h.lon], { radius: 8, color: '#1a202c', weight: 2, fillColor: colours[h.name] || '#333', fillOpacity: 1 })
             .bindPopup('<b>' + h.name + '</b><br>Level ' + h.level + ' | ' + h.side)
             .bindTooltip(h.name).addTo(hospMarkerLayer);
        });
        const overlays = { 'Hospitals': hospMarkerLayer };
        SECTOR_ORDER.forEach(sec => {
            sectorHosps[sec].forEach(name => {
                const c = colours[name];
                overlays['<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + c + ';margin-right:5px;vertical-align:middle;"></span>' + name] = hospLayers[name];
            });
        });
        L.control.layers({ 'Base Map': baseLayer }, overlays, { collapsed: true }).addTo(catchmentMap);
        setTimeout(() => {
            const ctrl = document.querySelector('#catchment-map .leaflet-control-layers-overlays');
            if (!ctrl) return;
            const btn = document.createElement('div');
            btn.style.cssText = 'padding:6px 0 2px 0;text-align:center;border-top:1px solid #ccc;margin-top:4px;';
            const a = document.createElement('a');
            a.href = '#';
            a.style.cssText = 'cursor:pointer;font-size:12px;color:#2e5b5f;text-decoration:none;font-weight:600;';
            a.textContent = 'Deselect All';
            let allOn = true;
            a.onclick = function(e) {
                e.preventDefault(); allOn = !allOn;
                ctrl.querySelectorAll('input[type=checkbox]').forEach(cb => { if (cb.checked !== allOn) cb.click(); });
                a.textContent = allOn ? 'Deselect All' : 'Select All';
            };
            btn.appendChild(a); ctrl.appendChild(btn);
        }, 500);
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div');
            div.style.cssText = 'background:white;padding:12px 16px;border-radius:10px;box-shadow:0 4px 16px rgba(46,91,95,0.15);font-size:12px;max-height:40vh;overflow-y:auto;line-height:1.7;min-width:190px;font-family:Fredoka,sans-serif;';
            let html = '<b style="font-size:13px;color:#2e5b5f;">Neonatal Catchment Areas</b>';
            SECTOR_ORDER.forEach(sec => {
                const hosps = sectorHosps[sec];
                if (!hosps.length) return;
                html += '<div style="margin-top:8px;margin-bottom:2px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#8aadb0;font-weight:600;">' + SECTOR_LABELS[sec] + '</div>';
                hosps.forEach(name => {
                    const c = colours[name]; const count = countsByName[name] || 0;
                    html += '<div><span style="background:' + c + ';width:12px;height:12px;display:inline-block;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>' + name + ' (' + count.toLocaleString() + ')</div>';
                });
            });
            div.innerHTML = html; return div;
        };
        legend.addTo(catchmentMap);
        document.getElementById('barFill').style.width = '100%';
        setTimeout(() => { document.getElementById('catchment-loading').style.display = 'none'; }, 400);
        catchmentLoaded = true;
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = document.getElementById('postcodeInput').value.trim();
        const key = raw.replace(/\s/g, '').toUpperCase();
        const errBar = document.getElementById('error');
        errBar.style.display = 'none';
        document.getElementById('results').style.display = 'none';
        if (!key) return;
        if (!postcodeData.data[key]) {
            document.getElementById('error-text').textContent = 'Postcode "' + raw + '" not found.';
            errBar.style.display = 'flex';
            return;
        }
        const r = postcodeData.data[key];
        const names = postcodeData.names;
        const data = {
            postcode: r[0], lat: r[1], lon: r[2],
            side: r[3] === 0 ? 'North' : 'South',
            levels: [
                { label: levelLabels[0], hospital: names[r[4]],  distance_km: r[5]  },
                { label: levelLabels[1], hospital: names[r[6]],  distance_km: r[7]  },
                { label: levelLabels[2], hospital: names[r[8]],  distance_km: r[9]  },
                { label: levelLabels[3], hospital: names[r[10]], distance_km: r[11] },
            ],
        };
        document.getElementById('resultPostcode').textContent = data.postcode;
        const badge = document.getElementById('resultSide');
        badge.textContent = '◆ ' + data.side + ' of Thames';
        badge.className = 'side-pill ' + (data.side === 'North' ? 'side-north' : 'side-south');
        const cardsEl = document.getElementById('cards');
        cardsEl.innerHTML = '';
        data.levels.forEach((lvl, i) => {
            const card = document.createElement('div');
            card.className = 'card ' + levelClasses[i];
            const hInfo = window.hospCoords[lvl.hospital];
            let tagsHtml = '';
            if (hInfo && hInfo.level === 3 && hInfo.tags) {
                tagsHtml = '<div class="card-tags">' + hInfo.tags.split(',').map(t => '<span class="tag">' + t.trim() + '</span>').join(' ') + '</div>';
            }
            card.innerHTML = '<div class="card-level-badge">' + lvl.label + '</div>' +
                '<div class="card-hospital">' + lvl.hospital + '</div>' +
                '<div class="card-distance"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
                lvl.distance_km + ' km away</div>' + tagsHtml;
            cardsEl.appendChild(card);
        });
        document.getElementById('results').style.display = 'block';
        if (map) map.remove();
        map = L.map('map').setView([data.lat, data.lon], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 19,
        }).addTo(map);
        markers = [];
        const pcMarker = L.circleMarker([data.lat, data.lon], {
            radius: 8, color: '#2e5b5f', weight: 2, fillColor: '#fff', fillOpacity: 1,
        }).addTo(map).bindPopup('<b>' + data.postcode + '</b><br>' + data.side + ' of Thames');
        markers.push(pcMarker);
        const seen = new Set();
        data.levels.forEach((lvl, i) => {
            if (seen.has(lvl.hospital)) return;
            seen.add(lvl.hospital);
            const hc = window.hospCoords[lvl.hospital];
            if (!hc) return;
            const hospMarker = L.circleMarker([hc.lat, hc.lon], {
                radius: 9, color: '#2e5b5f', weight: 2, fillColor: levelColours[i], fillOpacity: 0.9,
            }).addTo(map).bindPopup('<b>' + lvl.hospital + '</b><br>' + lvl.distance_km + ' km');
            markers.push(hospMarker);
            L.polyline([[data.lat, data.lon], [hc.lat, hc.lon]], {
                color: levelColours[i], weight: 2, dashArray: '6,6', opacity: 0.6,
            }).addTo(map);
        });
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.15));
    });

</script>

</body>

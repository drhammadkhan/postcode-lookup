<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Directory - HO.ME</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        @font-face {
            font-family: 'Fredoka';
            src: url('Fredoka Variable Font.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f7f8f8;
            --surface: #ffffff;
            --border: #dcebe7;
            --dark-teal: #2e5b5f;
            --text: #2e5b5f;
            --muted: #668b8e;
            --orange: #d2712a;
            --teal-light: #e0f2ec;
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 16px 20px 42px;
        }
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 550;
        }
        .breadcrumb a {
            color: var(--dark-teal);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .breadcrumb a:hover { color: var(--orange); }
        .breadcrumb-sep { color: #aac5c2; }
        .page-title {
            font-size: 1.28rem;
            line-height: 1.2;
            font-weight: 650;
            color: var(--dark-teal);
            margin-bottom: 16px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 17px 18px 15px;
            box-shadow: 0 8px 18px rgba(46,91,95,0.06);
        }
        .stat-value {
            font-size: 1.45rem;
            line-height: 1;
            font-weight: 650;
            color: var(--dark-teal);
        }
        .stat-label {
            font-size: 0.84rem;
            color: var(--muted);
            margin-top: 4px;
        }
        .directory {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(46,91,95,0.045);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: middle;
        }
        th {
            background: #f8fcfb;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        td { font-size: 0.92rem; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fbfdfc; }
        .hospital-name {
            font-weight: 650;
            color: var(--dark-teal);
            line-height: 1.25;
            margin-bottom: 4px;
        }
        .postcode { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 18px;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 0.68rem;
            font-weight: 650;
            white-space: nowrap;
        }
        .network { background: var(--teal-light); color: var(--dark-teal); }
        .level-3 { background: #fde9dc; color: #9b4d13; }
        .level-2 { background: #e0e8e7; color: var(--dark-teal); }
        .level-1 { background: #dff3ec; color: #23815f; }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            background: #eef5f3;
            color: var(--muted);
        }
        .empty {
            color: var(--muted);
            font-size: 0.88rem;
        }
        .phone-link {
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
        }
        .phone-link:hover { color: var(--orange); }
        .phone-link svg {
            width: 12px;
            height: 12px;
            flex: 0 0 auto;
        }
        footer {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px 24px;
            color: var(--muted);
            font-size: 0.82rem;
        }
        footer a { color: var(--dark-teal); text-decoration: none; font-weight: 650; }
        @media (max-width: 760px) {
            main { padding: 14px 14px 32px; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            table, thead, tbody, tr, th, td { display: block; }
            thead { display: none; }
            tr { border-bottom: 1px solid var(--border); padding: 10px 0; }
            tbody tr:last-child { border-bottom: none; }
            td { border: none; padding: 6px 14px; }
            td::before {
                content: attr(data-label);
                display: block;
                color: var(--muted);
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                margin-bottom: 3px;
            }
        }
    </style>
</head>
<body>
    <main>
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Home
            </a>
            <span class="breadcrumb-sep">/</span>
            <span>Hospitals</span>
        </nav>

        <h1 class="page-title">London Neonatal Units</h1>

        <section class="summary" aria-label="Hospital summary">
            <div class="stat"><div class="stat-value" id="totalHospitals">-</div><div class="stat-label">Hospitals</div></div>
            <div class="stat"><div class="stat-value" id="level3Count">-</div><div class="stat-label">Level 3 units</div></div>
            <div class="stat"><div class="stat-value" id="level2Count">-</div><div class="stat-label">Level 2 units</div></div>
            <div class="stat"><div class="stat-value" id="level1Count">-</div><div class="stat-label">Level 1 units</div></div>
        </section>

        <section class="directory">
            <table>
                <thead>
                    <tr>
                        <th>Hospital</th>
                        <th>Network</th>
                        <th>Care Level</th>
                        <th>Specialties</th>
                    </tr>
                </thead>
                <tbody id="hospitalRows">
                    <tr><td colspan="4" class="empty">Loading hospitals...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <a href="index.html">Lookup</a>
    </footer>

    <script>
        const networkNames = {
            NC: 'North Central',
            NE: 'North East',
            NW: 'North West',
            SE: 'South East',
            SW: 'South West',
            Border: 'Border'
        };
        const levelNames = {
            1: 'Level 1 - SCBU',
            2: 'Level 2 - LNU',
            3: 'Level 3 - NICU'
        };
        const hospitalDisplayNames = {
            'University Lewisham': 'Lewisham Hospital',
        };
        const hospitalPhones = {
            'Barnet Hospital': '020 8216 4600',
            'Chelsea & Westminster': '020 3315 8000',
            'Croydon University': '020 8401 3000',
            'Darent Valley': '01322 428 100',
            'East Surrey': '01737 768 511',
            'Epsom Hospital': '01372 735 735',
            "Evelina (St Thomas')": '020 7188 7188',
            'Hillingdon Hospital': '01895 238 282',
            'Homerton University': '020 8510 5555',
            'Kings College Hospital': '020 3299 9000',
            'Kingston Hospital': '020 8546 7711',
            'Newham General': '020 7476 4000',
            'North Middlesex': '020 8887 2000',
            'Northwick Park': '020 8864 3232',
            'Princess Royal (PRUH)': '01689 863 000',
            'Queen Elizabeth Woolwich': '020 8836 6000',
            "Queen Charlottes'": '020 3313 1111',
            'Queens Hospital': '0330 400 4333',
            'Royal Free Hospital': '020 7794 0500',
            'St Heliers Hospital': '020 8296 2000',
            'St Marys Hospital': '020 3312 6666',
            'St Peters Hospital': '01932 872000',
            'St. Georges Hospital': '020 8672 1255',
            'The Royal London': '020 7377 7000',
            'UCH (University College)': '020 3456 7890',
            'University Lewisham': '020 8333 3000',
            'Watford General': '01923 244 366',
            'West Middlesex': '020 8560 2121',
            'Whipps Cross': '020 8539 5522',
            'Whittington Hospital': '020 7272 3070',
            'Wexham Park': '0300 614 5000',
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function displayHospitalName(name) {
            return hospitalDisplayNames[name] || name;
        }

        function directorySortName(name) {
            return displayHospitalName(name).replace(/^St\.?\s+/i, '');
        }

        function renderTags(tags) {
            const parts = String(tags || '').split(',').map(t => t.trim()).filter(Boolean);
            if (!parts.length) return '<span class="empty">None listed</span>';
            return '<div class="tags">' + parts.map(tag =>
                '<span class="pill tag">' + escapeHtml(tag) + '</span>'
            ).join('') + '</div>';
        }

        function normaliseNetwork(sector) {
            if (sector === 'South East') return 'SE';
            if (sector === 'South West') return 'SW';
            return sector || '';
        }

        function phoneHref(phone) {
            return 'tel:' + String(phone).replace(/[^\d+]/g, '');
        }

        function renderPhone(hospitalName) {
            const phone = hospitalPhones[hospitalName];
            if (!phone) return '<span class="empty">Not listed</span>';
            return '<a class="phone-link" href="' + phoneHref(phone) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' + escapeHtml(phone) + '</a>';
        }

        fetch('hospitals.json')
            .then(response => response.json())
            .then(hospitals => {
                const rows = document.getElementById('hospitalRows');
                const sorted = hospitals.slice().sort((a, b) =>
                    directorySortName(a.name).localeCompare(directorySortName(b.name))
                );

                document.getElementById('totalHospitals').textContent = sorted.length;
                document.getElementById('level3Count').textContent = sorted.filter(h => h.level === 3).length;
                document.getElementById('level2Count').textContent = sorted.filter(h => h.level === 2).length;
                document.getElementById('level1Count').textContent = sorted.filter(h => h.level === 1).length;

                rows.innerHTML = sorted.map(hospital => {
                    const network = normaliseNetwork(hospital.sector);
                    const networkLabel = networkNames[network] || network || 'Unassigned';
                    const level = Number(hospital.level);
                    return `
                        <tr>
                            <td data-label="Hospital">
                                <div class="hospital-name">${escapeHtml(displayHospitalName(hospital.name))}</div>
                                ${renderPhone(hospital.name)}
                            </td>
                            <td data-label="Network"><span class="pill network">${escapeHtml(networkLabel)}</span></td>
                            <td data-label="Care Level"><span class="pill level-${level}">${escapeHtml(levelNames[level] || ('Level ' + level))}</span></td>
                            <td data-label="Specialties">${renderTags(hospital.tags)}</td>
                        </tr>
                    `;
                }).join('');
            })
            .catch(() => {
                document.getElementById('hospitalRows').innerHTML =
                    '<tr><td colspan="4" class="empty">Hospital data could not be loaded.</td></tr>';
            });
    </script>
</body>
</html>

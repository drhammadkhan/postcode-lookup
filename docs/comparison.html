<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catchment Comparison — Geographic vs Equalised</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 14px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
  header p  { font-size: 0.82rem; color: #94a3b8; }
  .map-row { display: flex; height: calc(100vh - 58px); }
  .map-col { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #334155; }
  .map-col:last-child { border-right: none; }
  .map-label { padding: 8px 16px; background: #1e293b; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .map-label .badge { padding: 2px 10px; border-radius: 99px; font-size: 0.72rem; }
  .badge-geo  { background: #166534; color: #bbf7d0; }
  .badge-eq   { background: #1e3a8a; color: #bfdbfe; }
  .map-label .note { color: #64748b; font-weight: 400; font-size: 0.72rem; }
  .leaflet-map { flex: 1; }
  .back-link { font-size: 0.75rem; color: #60a5fa; text-decoration: none; margin-left: auto; }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Neonatal Catchment Comparison</h1>
    <p>Left: nearest hospital (geographic Voronoi) &nbsp;·&nbsp; Right: population-equalised (±5%)</p>
  </div>
  <a class="back-link" href="index.html">← Back to lookup</a>
</header>

<div class="map-row">
  <!-- LEFT: Geographic Voronoi -->
  <div class="map-col">
    <div class="map-label">
      <span class="badge badge-geo">Geographic</span>
      Nearest hospital &nbsp;<span class="note">Compact catchments · unequal populations</span>
    </div>
    <div id="map-geo" class="leaflet-map"></div>
  </div>
  <!-- RIGHT: Equalised -->
  <div class="map-col">
    <div class="map-label">
      <span class="badge badge-eq">Equalised</span>
      Population-balanced &nbsp;<span class="note">Equal populations · stretched catchments</span>
    </div>
    <div id="map-eq" class="leaflet-map"></div>
  </div>
</div>

<script>
const HOSPITALS = [{"name":"Barnet Hospital","lat":51.6507,"lon":-0.2152,"level":2,"side":"North","color":"hsl(210,80%,22%)","vor_count":7114,"eq_population":256590,"eq_target":232487,"eq_pct_dev":10.4,"eq_count":8989,"vor_population":0},{"name":"Chelsea & Westminster","lat":51.4849,"lon":-0.1824,"level":3,"side":"North","color":"hsl(268,68%,22%)","vor_count":12909,"eq_population":185990,"eq_target":232487,"eq_pct_dev":-20.0,"eq_count":13670,"vor_population":0},{"name":"Croydon University","lat":51.3908,"lon":-0.1104,"level":2,"side":"South","color":"hsl(328,68%,32%)","vor_count":14495,"eq_population":240978,"eq_target":201636,"eq_pct_dev":19.5,"eq_count":13128,"vor_population":0},{"name":"Evelina (St Thomas')","lat":51.5003,"lon":-0.1189,"level":3,"side":"South","color":"hsl(18,82%,28%)","vor_count":7920,"eq_population":161310,"eq_target":201636,"eq_pct_dev":-20.0,"eq_count":9309,"vor_population":0},{"name":"Hillingdon Hospital","lat":51.5259,"lon":-0.4597,"level":2,"side":"North","color":"hsl(284,74%,41%)","vor_count":9267,"eq_population":268881,"eq_target":232487,"eq_pct_dev":15.7,"eq_count":9413,"vor_population":0},{"name":"Homerton University","lat":51.5508,"lon":-0.0462,"level":3,"side":"North","color":"hsl(108,72%,20%)","vor_count":6701,"eq_population":186866,"eq_target":232487,"eq_pct_dev":-19.6,"eq_count":7496,"vor_population":0},{"name":"Kings College Hospital","lat":51.4683,"lon":-0.0919,"level":3,"side":"South","color":"hsl(31,88%,49%)","vor_count":13997,"eq_population":161314,"eq_target":201636,"eq_pct_dev":-20.0,"eq_count":12910,"vor_population":0},{"name":"Kingston Hospital","lat":51.415,"lon":-0.2813,"level":2,"side":"South","color":"hsl(345,81%,60%)","vor_count":9996,"eq_population":193636,"eq_target":201636,"eq_pct_dev":-4.0,"eq_count":9996,"vor_population":0},{"name":"Newham General","lat":51.5223,"lon":0.035,"level":2,"side":"North","color":"hsl(126,80%,44%)","vor_count":11247,"eq_population":252058,"eq_target":232487,"eq_pct_dev":8.4,"eq_count":10892,"vor_population":0},{"name":"North Middlesex","lat":51.6133,"lon":-0.073,"level":1,"side":"North","color":"hsl(222,85%,47%)","vor_count":14921,"eq_population":278984,"eq_target":232487,"eq_pct_dev":20.0,"eq_count":12502,"vor_population":0},{"name":"Northwick Park","lat":51.5767,"lon":-0.3222,"level":2,"side":"North","color":"hsl(300,81%,60%)","vor_count":20483,"eq_population":278984,"eq_target":232487,"eq_pct_dev":20.0,"eq_count":14958,"vor_population":0},{"name":"Princess Royal (PRUH)","lat":51.3656,"lon":0.06,"level":2,"side":"South","color":"hsl(44,95%,70%)","vor_count":7094,"eq_population":224992,"eq_target":201636,"eq_pct_dev":11.6,"eq_count":7094,"vor_population":0},{"name":"Queen Charlottes'","lat":51.517,"lon":-0.2363,"level":3,"side":"North","color":"hsl(308,85%,70%)","vor_count":13189,"eq_population":204848,"eq_target":232487,"eq_pct_dev":-11.9,"eq_count":13715,"vor_population":0},{"name":"Queen Elizabeth Woolwich","lat":51.4788,"lon":0.0514,"level":2,"side":"South","color":"hsl(37,91%,59%)","vor_count":13289,"eq_population":241964,"eq_target":201636,"eq_pct_dev":20.0,"eq_count":13071,"vor_population":0},{"name":"Queens Hospital","lat":51.5694,"lon":0.1779,"level":2,"side":"North","color":"hsl(145,88%,68%)","vor_count":12346,"eq_population":278984,"eq_target":232487,"eq_pct_dev":20.0,"eq_count":11810,"vor_population":0},{"name":"Royal Free Hospital","lat":51.5532,"lon":-0.1654,"level":1,"side":"North","color":"hsl(235,90%,72%)","vor_count":10886,"eq_population":226680,"eq_target":232487,"eq_pct_dev":-2.5,"eq_count":10821,"vor_population":0},{"name":"St Heliers Hospital","lat":51.3806,"lon":-0.1831,"level":2,"side":"South","color":"hsl(354,88%,74%)","vor_count":8133,"eq_population":223415,"eq_target":201636,"eq_pct_dev":10.8,"eq_count":7521,"vor_population":0},{"name":"St Marys Hospital","lat":51.5173,"lon":-0.1738,"level":2,"side":"North","color":"hsl(292,78%,50%)","vor_count":12217,"eq_population":185990,"eq_target":232487,"eq_pct_dev":-20.0,"eq_count":13410,"vor_population":0},{"name":"St. Georges Hospital","lat":51.4273,"lon":-0.1748,"level":3,"side":"South","color":"hsl(336,74%,46%)","vor_count":14042,"eq_population":161311,"eq_target":201636,"eq_pct_dev":-20.0,"eq_count":15876,"vor_population":0},{"name":"The Royal London","lat":51.5185,"lon":-0.0594,"level":3,"side":"North","color":"hsl(135,84%,56%)","vor_count":17011,"eq_population":185990,"eq_target":232487,"eq_pct_dev":-20.0,"eq_count":18130,"vor_population":0},{"name":"UCH (University College)","lat":51.5248,"lon":-0.1352,"level":3,"side":"North","color":"hsl(228,87%,59%)","vor_count":39043,"eq_population":185990,"eq_target":232487,"eq_pct_dev":-20.0,"eq_count":42185,"vor_population":0},{"name":"University Lewisham","lat":51.4528,"lon":-0.0186,"level":2,"side":"South","color":"hsl(24,85%,38%)","vor_count":12250,"eq_population":205812,"eq_target":201636,"eq_pct_dev":2.1,"eq_count":12311,"vor_population":0},{"name":"West Middlesex","lat":51.4733,"lon":-0.3249,"level":1,"side":"North","color":"hsl(276,71%,31%)","vor_count":17093,"eq_population":269600,"eq_target":232487,"eq_pct_dev":16.0,"eq_count":16152,"vor_population":0},{"name":"Whipps Cross","lat":51.5785,"lon":0.002,"level":2,"side":"North","color":"hsl(117,76%,32%)","vor_count":9727,"eq_population":278984,"eq_target":232487,"eq_pct_dev":20.0,"eq_count":8638,"vor_population":0},{"name":"Whittington Hospital","lat":51.5665,"lon":-0.1403,"level":2,"side":"North","color":"hsl(216,82%,34%)","vor_count":10844,"eq_population":194375,"eq_target":232487,"eq_pct_dev":-16.4,"eq_count":12217,"vor_population":0}];
let DOTS = null;

// ── Create both maps ──────────────────────────────────────────────────────────
function makeMap(id) {
  const m = L.map(id, { center: [51.505, -0.09], zoom: 10, zoomControl: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 19
  }).addTo(m);
  L.control.zoom({ position: 'bottomleft' }).addTo(m);
  return m;
}

const mapGeo = makeMap('map-geo');
const mapEq  = makeMap('map-eq');

// Sync pan/zoom between maps
let syncing = false;
function syncMaps(source, target) {
  source.on('moveend', () => {
    if (syncing) return;
    syncing = true;
    target.setView(source.getCenter(), source.getZoom(), { animate: false });
    syncing = false;
  });
}
syncMaps(mapGeo, mapEq);
syncMaps(mapEq, mapGeo);

// ── Hospital panes ────────────────────────────────────────────────────────────
[mapGeo, mapEq].forEach(m => {
  m.createPane('hospitalPane');
  m.getPane('hospitalPane').style.zIndex = 650;
});

// ── Plot dots ─────────────────────────────────────────────────────────────────
function plotDots(dots) {
  dots.forEach(d => {
    const hGeo = HOSPITALS[d[2]];
    const hEq  = HOSPITALS[d[3]];
    L.circleMarker([d[0], d[1]], {
      radius: 2.5, color: hGeo.color, weight: 0,
      fillColor: hGeo.color, fillOpacity: 0.75
    }).addTo(mapGeo);
    L.circleMarker([d[0], d[1]], {
      radius: 2.5, color: hEq.color, weight: 0,
      fillColor: hEq.color, fillOpacity: 0.75
    }).addTo(mapEq);
  });
}

fetch('comparison_dots.json').then(r => r.json()).then(dots => {
  DOTS = dots;
  plotDots(dots);
});

// ── Hospital markers ──────────────────────────────────────────────────────────
HOSPITALS.forEach(h => {
  if (!h.lat) return;
  const levelLabel = h.level === 3 ? 'NICU (L3)' : h.level === 2 ? 'HDU (L2)' : 'Special Care (L1)';
  const radius = h.level === 3 ? 11 : h.level === 2 ? 9 : 7;

  function makeMarker(map, popupHTML) {
    L.circleMarker([h.lat, h.lon], {
      pane: 'hospitalPane', radius: radius + 3, color: 'white', weight: 0,
      fillColor: 'white', fillOpacity: 0.9, interactive: false
    }).addTo(map);
    L.circleMarker([h.lat, h.lon], {
      pane: 'hospitalPane', radius, color: '#1A2340', weight: 2,
      fillColor: h.color, fillOpacity: 1
    }).bindPopup(popupHTML)
      .bindTooltip(h.name, { permanent: false, direction: 'top', offset: [0, -12] })
      .addTo(map);
  }

  makeMarker(mapGeo,
    '<b>' + h.name + '</b><br>' + levelLabel + '<br>' +
    'Population: <b>' + h.vor_population.toLocaleString() + '</b><br>' +
    'Postcodes: ' + h.vor_count.toLocaleString()
  );
  const devSign = h.eq_pct_dev >= 0 ? '+' : '';
  makeMarker(mapEq,
    '<b>' + h.name + '</b><br>' + levelLabel + '<br>' +
    'Population: <b>' + h.eq_population.toLocaleString() + '</b><br>' +
    'Target: ' + h.eq_target.toLocaleString() + '<br>' +
    'Deviation: <b>' + devSign + h.eq_pct_dev + '%</b><br>' +
    'Postcodes: ' + h.eq_count.toLocaleString()
  );
});
</script>
</body>
</html>

    a.textContent = 'Deselect All';
    var on = true;
    a.onclick = function (e) {
      e.preventDefault(); on = !on;

        if (cb.checked !== on) cb.click();
      });

    };
    div.appendChild(a);
    ctrl.appendChild(div);
  }, 500);
});

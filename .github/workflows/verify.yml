name: Verify generated files

# Fails when the committed generated files (output/, docs/*.json, maps, pages, README
# numbers) do not match what `python3 build_all.py` produces from hospitals_refined.csv.
# Fix: run `python3 build_all.py` locally and commit the result.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Consistency tests
        run: python3 -m pytest tests -q

      - name: Rebuild everything
        run: python3 build_all.py

      - name: Check nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'python3 build_all.py' and commit the result."
            git status --short
            git diff --stat | tail -20
            exit 1
          fi
